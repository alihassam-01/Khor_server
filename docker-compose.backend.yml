services:
  server-prod:
    build:
      context: .
      dockerfile: Dockerfile
    image: khor-server:latest
    container_name: khor-server-prod
    profiles:
      - prod
    env_file:
      - .env.production
    environment:
      NODE_ENV: production
      PORT: 5000
      SERVER_HOST: 0.0.0.0
      RUN_MIGRATIONS: "false"
    network_mode: host
    restart: unless-stopped

  server-staging:
    build:
      context: .
      dockerfile: Dockerfile
    image: khor-server:latest
    container_name: khor-server-staging
    profiles:
      - staging
    env_file:
      - .env.staging
    environment:
      NODE_ENV: production
      PORT: 5001
      SERVER_HOST: 0.0.0.0
      RUN_MIGRATIONS: "false"
    network_mode: host
    restart: unless-stopped
